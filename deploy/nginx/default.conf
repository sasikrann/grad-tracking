upstream backend_upstream {
  server backend:3000;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 12m;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Uploaded files are never public. Clients must use an authorized API route.
  location ^~ /uploads/ {
    return 404;
  }

  # Only the backend can authorize and redirect a request to these locations.
  location /protected-media/evidence/ {
    internal;
    alias /srv/uploads/evidence/;
    add_header Cache-Control "private, no-store";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location /protected-media/notifications/ {
    internal;
    alias /srv/uploads/notifications/;
    add_header Cache-Control "private, no-store";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "gateway ok\n";
  }

  location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri /index.html;
  }
}
