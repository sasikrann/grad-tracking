upstream frontend_upstream {
  server frontend:80;
}

upstream backend_upstream {
  server backend:3000;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 12m;

  location /api/ {
    proxy_pass http://backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Only the backend can authorize and redirect a request to these locations.
  location /protected-media/evidence/ {
    internal;
    alias /srv/uploads/evidence/;
    add_header Cache-Control "private, no-store";
  }

  location /protected-media/notifications/ {
    internal;
    alias /srv/uploads/notifications/;
    add_header Cache-Control "private, no-store";
  }

  location / {
    proxy_pass http://frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
