services:
  backend:
    container_name: grad-tracking-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      ENABLE_DOCKER_DEV_LOGIN: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-grad_tracking}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

volumes:
  backend_node_modules:
